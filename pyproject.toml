[project]
name = "yt-notifier-discord"
version = "0.1.0"
description = "YouTube channel polling notifier for Discord"
authors = [{ name = "akaaku" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.2,<0.29",
  "pytz>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1.0"
]

[project.scripts]
yt-notifier-discord = "src.yt_monitor:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["yt_monitor.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
dev-dependencies = ["pytest>=8.1.0"]
